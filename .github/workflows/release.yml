name: Release & Binary Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Standalone Executables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Compile Standalone Binaries
        run: |
          mkdir -p release-binaries
          
          # Linux x64
          bun build --compile --target=bun-linux-x64 --minify --external cpu-features \
            --outfile=release-binaries/pubctl-linux-x64 src/index.ts
            
          # Linux arm64
          bun build --compile --target=bun-linux-arm64 --minify --external cpu-features \
            --outfile=release-binaries/pubctl-linux-arm64 src/index.ts
            
          # macOS Apple Silicon (arm64)
          bun build --compile --target=bun-darwin-arm64 --minify --external cpu-features \
            --outfile=release-binaries/pubctl-darwin-arm64 src/index.ts
            
          # macOS Intel (x64)
          bun build --compile --target=bun-darwin-x64 --minify --external cpu-features \
            --outfile=release-binaries/pubctl-darwin-x64 src/index.ts

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
